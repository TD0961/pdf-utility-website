<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- High-contrast edge-to-edge squircle with micro inner bevel -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" />

  <!-- Document Contour: Optimized padding and bold stroke weight for high tab visibility -->
  <g>
    <!-- Document Body Silhouette -->
    <path
      d="M120 64 H324 L448 188 V392 C448 423 423 448 392 448 H120 C89 448 64 423 64 392 V120 C64 89 89 64 120 64 Z"
      stroke="#ffffff"
      stroke-width="38"
      stroke-linejoin="round"
      fill="rgba(255,255,255,0.14)"
    />
    <!-- Vibrant Folded Corner Flap -->
    <path
      d="M324 64 V174 C324 182 330 188 338 188 H448 L324 64 Z"
      fill="url(#foldGrad)"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <!-- Bold, High-Contrast Stylized S-Curve -->
    <path
      d="M324 228 H218 C182 228 156 252 156 282 C156 312 182 332 218 332 H294 C330 332 356 352 356 382 C356 412 330 436 294 436 H188"
      fill="none"
      stroke="#ffffff"
      stroke-width="50"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Distinct Dynamic Flow Terminals -->
    <circle cx="324" cy="228" r="26" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
    <circle cx="188" cy="436" r="26" fill="#c084fc" stroke="#ffffff" stroke-width="4" />
  </g>
</svg>
