<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.35" />
    </filter>
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base with Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border Glow -->
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- Document Sheet -->
  <g filter="url(#docShadow)">
    <path d="M136 96 H288 L376 184 V384 C376 401.673 361.673 416 344 416 H136 C118.327 416 104 401.673 104 384 V128 C104 110.327 118.327 96 136 96 Z" fill="#ffffff" />
    <!-- Folded Corner -->
    <path d="M288 96 V160 C288 173.255 298.745 184 312 184 H376 Z" fill="url(#foldGrad)" />
  </g>

  <!-- Custom Brand Mark "Like" / Thumbs-up inside Document -->
  <g transform="translate(148, 204)">
    <!-- Cuff / Palm Base -->
    <rect x="8" y="56" width="28" height="88" rx="12" fill="#4f46e5" />
    <!-- Hand & Thumb Curve -->
    <path
      d="M52 40 C52 20 60 4 76 4 C88 4 92 14 92 28 C92 42 84 56 84 68 H132 C146 68 156 78 156 92 C156 96 154 100 151 104 C154 108 156 112 156 117 C156 122 154 126 151 130 C154 134 155 138 155 142 C155 154 144 164 132 164 H72 C56 164 44 152 40 136"
      fill="none"
      stroke="#4f46e5"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Privacy Shield Badge (Bottom Right Zero-Upload Indicator) -->
  <g transform="translate(296, 296)">
    <circle cx="56" cy="56" r="52" fill="#ffffff" filter="url(#docShadow)" />
    <path d="M56 26 C72 26 84 32 84 32 V58 C84 76 72 88 56 94 C40 88 28 76 28 58 V32 C28 32 40 26 56 26 Z" fill="url(#badgeGrad)" />
    <path d="M44 58 L52 66 L68 46" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
